<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>바다따라: 해안도로 감성 드라이브 (해수욕장 2경유 + POI)</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; }
    #map { width: 100%; height: 88vh; }
    #controls {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: #f7f7f7; border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    input { width: 300px; padding: 8px; }
    button {
      padding: 8px 14px; border: 0; cursor: pointer; font-weight: 700;
      color: #fff; background: #2563eb; border-radius: 8px;
    }
    .chip { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; }
    #poiList { padding: 8px 10px; max-height: 32vh; overflow: auto; }
    .poi { border: 1px solid #eee; border-radius: 10px; padding: 8px; margin: 8px 0; }
    .poi img { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 애월읍 일주서로 6322)">
    <input id="end" placeholder="도착지 (예: 호근동 태평로 152)">
    <button id="go">경로 계산</button>
    <span class="chip">제주↔제주만 허용</span>
    <span class="chip">경유지 2곳(가능시)</span>
  </div>
  <div id="map"></div>
  <div id="poiList"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([126.531, 33.499]), zoom: 10 })
    });

    let routeLayer = null;
    let markerLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(markerLayer);

    function clearMap() {
      if (routeLayer) map.removeLayer(routeLayer);
      markerLayer.getSource().clear();
    }

    function drawRoute(lonlatCoords) {
      const line = new ol.geom.LineString(lonlatCoords.map(c => ol.proj.fromLonLat(c)));
      routeLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [new ol.Feature({ geometry: line })] }),
        style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#2563eb", width: 4 }) })
      });
      map.addLayer(routeLayer);
      map.getView().fit(line, { padding: [50, 50, 50, 50], maxZoom: 13 });
    }

    function addMarker(lon, lat, color, label, star=false) {
      const style = new ol.style.Style({
        image: star ? new ol.style.RegularShape({ points: 5, radius: 12, radius2: 6, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: "#fff", width: 2 }) })
                    : new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: "#fff", width: 2 }) }),
        text: new ol.style.Text({ text: label || "", offsetY: -18, fill: new ol.style.Fill({ color: "#111" }), stroke: new ol.style.Stroke({ color: "#fff", width: 3 }) })
      });
      const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])) });
      f.setStyle(style);
      markerLayer.getSource().addFeature(f);
    }

    const overlayEl = document.createElement("div");
    overlayEl.style.background = "#fff";
    overlayEl.style.border = "1px solid #ddd";
    overlayEl.style.borderRadius = "10px";
    overlayEl.style.padding = "8px 10px";
    overlayEl.style.minWidth = "240px";
    const overlay = new ol.Overlay({ element: overlayEl, autoPan: { animation: { duration: 200 } } });
    map.addOverlay(overlay);

    map.on("singleclick", evt => {
      const f = map.forEachFeatureAtPixel(evt.pixel, g => g);
      if (!f) return;
      const p = f.get("_poi");
      if (!p) return;
      overlayEl.innerHTML = `
        <div style="font-weight:700;margin-bottom:6px">${p.title || "이름 미상"}</div>
        ${p.firstimage ? `<img src="${p.firstimage}" style="width:100%;border-radius:8px;margin-bottom:6px">` : ""}
        <div style="font-size:12px;color:#334155">${p.addr1 || ""}</div>
        ${p.hours ? `<div style="font-size:12px;margin-top:4px">⏰ ${p.hours}</div>` : ""}
        ${p.parking ? `<div style="font-size:12px">🅿️ ${p.parking}</div>` : ""}
        ${p.homepage ? `<div style="margin-top:6px"><a href="${p.homepage}" target="_blank">자세히 보기</a></div>` : ""}
      `;
      overlay.setPosition(evt.coordinate);
    });

    function pushPOIMarkers(spots) {
      const source = markerLayer.getSource();
      spots.forEach(p => {
        const feat = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(p.mapx), parseFloat(p.mapy)])) });
        feat.set("_poi", p);
        feat.setStyle(new ol.style.Style({
          image: new ol.style.Circle({ radius: 5, fill: new ol.style.Fill({ color: "#10b981" }), stroke: new ol.style.Stroke({ color: "#fff", width: 1.5 }) })
        }));
        source.addFeature(feat);
      });
    }

    function renderPOIList(spots) {
      const box = document.getElementById("poiList");
      box.innerHTML = "";
      spots.forEach(p => {
        const div = document.createElement("div");
        div.className = "poi";
        div.innerHTML = `
          <div style="font-weight:700">${p.title || ""}</div>
          ${p.firstimage ? `<img src="${p.firstimage}" alt="${p.title}">` : ""}
          <div style="font-size:13px;color:#475569;margin-top:4px">${p.addr1 || ""}</div>
          ${p.hours ? `<div style="font-size:12px;margin-top:2px">⏰ ${p.hours}</div>` : ""}
          ${p.parking ? `<div style="font-size:12px">🅿️ ${p.parking}</div>` : ""}
          ${p.homepage ? `<div style="font-size:12px;margin-top:4px"><a href="${p.homepage}" target="_blank">자세히 보기</a></div>` : ""}
        `;
        box.appendChild(div);
      });
    }

    document.getElementById("go").addEventListener("click", async () => {
      const start = document.getElementById("start").value.trim();
      const end = document.getElementById("end").value.trim();
      if (!start || !end) { alert("출발지와 도착지를 모두 입력하세요."); return; }

      clearMap();
      try {
        const res = await fetch("/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, end, jeju_only: true })
        });
        const result = await res.json();
        if (!res.ok || !result.route) {
          throw new Error(result.error || "서버 오류");
        }

        const coords = result.route.features[0].geometry.coordinates.map(([lon, lat]) => [lon, lat]);
        drawRoute(coords);

        // 경유지 마킹(최대 2개)
        (result.waypoints || []).forEach((wp, i) => {
          addMarker(wp.lon, wp.lat, "#f59e0b", `경유${i+1}`, true);
        });

        // 출발/도착 마커(경로 첫/끝점 사용)
        const first = coords[0], last = coords[coords.length - 1];
        addMarker(first[0], first[1], "#22c55e", "출발");
        addMarker(last[0], last[1], "#ef4444", "도착");

        // POI
        const spots = result.spots || [];
        pushPOIMarkers(spots);
        renderPOIList(spots);

        // 경유지 주소 안내
        if (result.waypoints && result.waypoints.length) {
          const lines = result.waypoints.map(w => `- ${w.name} / ${w.address}`).join("\n");
          alert("경유 해안지점:\n" + lines);
        }
      } catch (e) {
        alert("경로 요청 실패: " + e.message);
        console.error(e);
      }
    });

    // 빠른 테스트 기본값
    document.getElementById("start").value = "애월읍 일주서로 6322";
    document.getElementById("end").value = "호근동 태평로 152";
  </script>
</body>
</html>
