<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>바다따라: 해안도로 드라이브 추천</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <style>
    #map {
      width: 100%;
      height: 90vh;
    }
    #controls {
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="controls">
    출발지: <input type="text" id="start" placeholder="예: 세종시청" />
    도착지: <input type="text" id="end" placeholder="예: 속초시청" />
    <button onclick="calculateRoute()">경로 계산</button>
  </div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <script>
    const map = new ol.Map({
      target: "map",
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([127.5, 36.5]),
        zoom: 7
      })
    });

    const vectorSource = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({ source: vectorSource });
    map.addLayer(vectorLayer);

    function createMarker(lon, lat, name, addr, imageUrl, contentId, type) {
      const color = type === "tour" ? "red" : "blue";

      const marker = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        name: name,
        addr: addr,
        imageUrl: imageUrl,
        contentId: contentId,
        type: type
      });

      marker.setStyle(
        new ol.style.Style({
          image: new ol.style.Circle({
            radius: 7,
            fill: new ol.style.Fill({ color: color }),
            stroke: new ol.style.Stroke({ color: "#fff", width: 1 })
          })
        })
      );

      vectorSource.addFeature(marker);
    }

    const overlay = new ol.Overlay({
      element: document.createElement("div"),
      positioning: "bottom-center",
      stopEvent: false,
      offset: [0, -15]
    });
    map.addOverlay(overlay);

    map.on("click", function (evt) {
      map.forEachFeatureAtPixel(evt.pixel, function (feature) {
        const coord = feature.getGeometry().getCoordinates();
        const name = feature.get("name");
        const addr = feature.get("addr");
        const img = feature.get("imageUrl");
        const contentId = feature.get("contentId");
        const type = feature.get("type");

        const element = document.createElement("div");
        element.style.background = "white";
        element.style.padding = "8px";
        element.style.border = "1px solid gray";
        element.innerHTML = `
          <b>${name}</b><br/>
          ${addr}<br/>
          ${img ? `<img src="${img}" width="200" /><br/>` : ""}
          ${contentId ? `<a href="/tour_detail/${contentId}" target="_blank">자세히 보기</a>` : ""}
        `;

        overlay.setPosition(coord);
        overlay.setElement(element);
      });
    });

    function calculateRoute() {
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;

      fetch("/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, end })
      })
        .then(res => res.json())
        .then(data => {
          vectorSource.clear();

          if (data.route) {
            const routeFeature = new ol.format.GeoJSON().readFeature(data.route, {
              featureProjection: "EPSG:3857"
            });
            vectorSource.addFeature(routeFeature);
          }

          data.spots.forEach(s =>
            createMarker(s.mapx, s.mapy, s.title, s.addr1, s.firstimage, s.contentid, "tour")
          );
          data.restaurants.forEach(r =>
            createMarker(r.mapx, r.mapy, r.title, r.addr1, r.firstimage, r.contentid, "food")
          );
        });
    }
  </script>
</body>
</html>
