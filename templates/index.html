<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Coastal Drive</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <style>
    :root{ --bg:#f7f7f7; --ink:#111; --line:#ddd; --route:#0066ff; --tour:#1976d2; --food:#388e3c; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif}
    #controls{padding:10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #controls input{width:280px;padding:8px 10px;border:1px solid #ccc;border-radius:6px}
    #controls button{padding:8px 14px;border:0;border-radius:6px;background:var(--ink);color:#fff;cursor:pointer}
    #map{width:100%;height:calc(100vh - 64px)}
    #summary{font-size:13px;color:#333;margin-left:6px}
    .legend{margin-left:auto;display:flex;gap:12px;font-size:13px}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
    .legend .tour i{background:var(--tour)}
    .legend .food i{background:var(--food)}
    .legend .route i{width:16px;height:3px;border-radius:2px;background:var(--route)}

    .ol-popup{position:absolute;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:10px 12px;border-radius:8px;border:1px solid #ccc;min-width:240px;z-index:1000}
    .ol-popup:after,.ol-popup:before{top:100%;border:solid transparent;content:"";height:0;width:0;position:absolute;pointer-events:none}
    .ol-popup:after{border-top-color:#fff;border-width:10px;left:48px;margin-left:-10px}
    .ol-popup:before{border-top-color:#ccc;border-width:11px;left:48px;margin-left:-11px}
    .popup-title{font-weight:600;margin-bottom:6px}
    .popup-row{font-size:13px;color:#333;margin:3px 0}
    .popup-img{width:100%;max-height:160px;object-fit:cover;border-radius:6px;margin:6px 0;display:none}
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종시청)">
    <input id="end" placeholder="도착지 (예: 속초시청)">
    <button id="btn">경로 계산</button>
    <div class="legend">
      <span class="route"><i></i>경로</span>
      <span class="tour"><i></i>관광지</span>
      <span class="food"><i></i>맛집</span>
    </div>
    <div id="summary"></div>
  </div>

  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5,36.5]), zoom: 7 })
    });

    let routeLayer = null;
    const tourLayer = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 30 });
    const foodLayer = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 40 });
    map.addLayer(tourLayer); map.addLayer(foodLayer);

    const routeStyle = new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#0066ff', width: 4 }) });
    const tourStyle  = new ol.style.Style({ image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#1976d2' }), stroke: new ol.style.Stroke({ color:'#fff', width:1 }) })});
    const foodStyle  = new ol.style.Style({ image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#388e3c' }), stroke: new ol.style.Stroke({ color:'#fff', width:1 }) })});
    tourLayer.setStyle(tourStyle); foodLayer.setStyle(foodStyle);

    function fmtDist(m){ if(!isFinite(m)) return ""; if(m>=1000) return (m/1000).toFixed(1)+" km"; return Math.round(m)+" m"; }
    function fmtDur(s){ if(!isFinite(s)) return ""; const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return (h?`${h}시간 `:"")+`${m}분`; }
    function esc(t){return (t||"").toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

    function drawRoute(coordsLonLat){
      const coords3857 = coordsLonLat.map(([lon,lat])=>ol.proj.fromLonLat([lon,lat]));
      if(routeLayer) map.removeLayer(routeLayer);
      routeLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          features: [ new ol.Feature({ geometry: new ol.geom.LineString(coords3857) }) ]
        }), style: routeStyle, zIndex: 10
      });
      map.addLayer(routeLayer);
      map.getView().fit(new ol.geom.LineString(coords3857), { padding:[50,50,50,50], maxZoom: 12 });
    }

    function addSpots(spots){
      tourLayer.getSource().clear();
      foodLayer.getSource().clear();
      if(!Array.isArray(spots)) return;
      for(const s of spots){
        const lon = parseFloat(s.mapx), lat = parseFloat(s.mapy);
        if(!isFinite(lon)||!isFinite(lat)) continue;
        const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([lon,lat])), ...s });
        (s.category==='food' ? foodLayer : tourLayer).getSource().addFeature(f);
      }
    }

    // 클릭 팝업
    const popupEl = document.createElement('div');
    popupEl.className = 'ol-popup';
    const overlay = new ol.Overlay({ element: popupEl, autoPan: { animation: { duration: 250 } } });
    map.addOverlay(overlay);

    function popupHTML(p){
      const cat = p.category==='food' ? '맛집' : '관광지';
      const img = (p.firstimage && typeof p.firstimage==='string') ? p.firstimage : '';
      const lines = [];
      if(p.addr1) lines.push(`<div class="popup-row">${esc(p.addr1)}</div>`);
      if(p.tel)   lines.push(`<div class="popup-row">전화: ${esc(p.tel)}</div>`);
      if(p.openhour) lines.push(`<div class="popup-row">운영시간: ${esc(p.openhour)}</div>`);
      if(p.restday)  lines.push(`<div class="popup-row">휴무: ${esc(p.restday)}</div>`);
      if(p.parking_info) lines.push(`<div class="popup-row">주차: ${esc(p.parking_info)}</div>`);
      if(p.homepage){ const link = esc(p.homepage); lines.push(`<div class="popup-row"><a href="${link}" target="_blank" rel="noopener">홈페이지</a></div>`); }
      if(p.contentid){ lines.push(`<div class="popup-row"><a href="/tour_detail/${esc(p.contentid)}" target="_blank" rel="noopener">자세히 보기</a></div>`); }
      return `
        <div class="popup-title">[${cat}] ${esc(p.title||'정보')}</div>
        ${img ? `<img class="popup-img" src="${img}" onload="this.style.display='block'" onerror="this.style.display='none'">` : ''}
        ${lines.join('')}
      `;
    }

    map.on('singleclick', (evt)=>{
      popupEl.style.display = 'none';
      let feature=null;
      map.forEachFeatureAtPixel(evt.pixel, f=>{ feature=f; return true; }, {hitTolerance: 8});
      if(!feature){ overlay.setPosition(undefined); return; }
      const props = feature.getProperties();
      if(!props.title){ overlay.setPosition(undefined); return; }
      popupEl.innerHTML = popupHTML(props);
      overlay.setPosition(feature.getGeometry().getCoordinates());
      popupEl.style.display = 'block';
    });

    document.getElementById('btn').addEventListener('click', async ()=>{
      const start = document.getElementById('start').value.trim();
      const end   = document.getElementById('end').value.trim();
      if(!start || !end){ alert('출발지와 도착지를 모두 입력하세요.'); return; }

      try{
        const res = await fetch('/route', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ start, end })
        });
        const data = await res.json();
        if(!res.ok || !data.route) throw new Error(data.error || '경로 요청 실패');

        const feat = data.route.features[0];
        const coords = feat.geometry.coordinates; // [lon,lat]*
        drawRoute(coords);

        // 요약 표시
        const dist = (data.summary && data.summary.distance) ? data.summary.distance : (feat.properties?.summary?.distance || 0);
        const dur  = (data.summary && data.summary.duration) ? data.summary.duration : (feat.properties?.summary?.duration || 0);
        const tourN = (data.spots_grouped?.tour || []).length;
        const foodN = (data.spots_grouped?.food || []).length;
        document.getElementById('summary').textContent = `거리 ${fmtDist(dist)} · 예상 ${fmtDur(dur)} · 관광지 ${tourN} · 맛집 ${foodN} (총 ${tourN+foodN})`;

        // 마커
        addSpots(Array.isArray(data.spots) ? data.spots : []);

        // 진단(필요시 콘솔확인)
        if(data.tourapi_probe) console.log('TourAPI probe:', data.tourapi_probe);

      }catch(err){
        console.error(err);
        alert('요청 실패: ' + (err.message || err));
      }
    });
  </script>
</body>
</html>
