<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>동해안 드라이브 (세종→속초, 남애·낙산·하조대 경유)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/ol.js"></script>
  <style>
    html, body { margin:0; height:100%; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif; }
    #bar { padding:10px 14px; border-bottom:1px solid #e5e7eb; display:flex; gap:10px; align-items:center; }
    #bar .b { padding:8px 12px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer;}
    #bar .b.primary { background:#111827; color:#fff; border-color:#111827; }
    #bar input { padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; min-width:220px; }
    #toast { position:fixed; top:10px; right:10px; background:#111827; color:#fff; padding:7px 10px; border-radius:6px; display:none; z-index:9999; }

    #map { height: calc(100% - 52px); }

    /* POI 마커 */
    .poi {
      width: 14px; height:14px; border-radius:50%;
      background:#2563eb;
      border:2px solid #fff;
      box-shadow:0 1px 3px rgba(0,0,0,.3);
    }

    /* 호버 툴팁 */
    .ol-tooltip {
      position: absolute;
      background: #fff;
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      min-width: 240px;
      pointer-events: none;
      z-index: 1000;
    }
    .ol-tooltip h4 { margin:0 0 6px; font-size:14px; }
    .ol-tooltip .row { display:flex; gap:8px; }
    .ol-tooltip img { width:72px; height:72px; object-fit:cover; border-radius:6px; background:#f3f4f6; }
    .ol-tooltip .meta { font-size:12px; color:#4b5563; }
    .ol-tooltip .addr { font-size:12px; color:#374151; margin-top:4px; }
    .ol-tooltip .dist { font-size:12px; color:#2563eb; font-weight:600; margin-top:4px; }
  </style>
</head>
<body>
  <div id="bar">
    <div>경유지(고정): 남애 · 낙산 · 하조대</div>
    <button class="b primary" id="btnGo">경로 탐색</button>
    <span id="loading" style="display:none; color:#6b7280;">경로와 관광지 불러오는 중…</span>
  </div>
  <div id="toast"></div>
  <div id="map"></div>

  <script>
    // ---------- 지도 ----------
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([128.2, 37.6]), zoom: 8 })
    });

    // 경로 레이어
    const routeLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#111827', width: 4 })
      })
    });
    map.addLayer(routeLayer);

    // POI 레이어
    const poiSource = new ol.source.Vector();
    const poiLayer = new ol.layer.Vector({
      source: poiSource,
      style: feature => {
        return new ol.style.Style({
          image: new ol.style.Circle({
            radius: 6,
            fill: new ol.style.Fill({ color: '#2563eb' }),
            stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
          })
        });
      }
    });
    map.addLayer(poiLayer);

    function showToast(msg, ms=2600) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', ms);
    }

    // ---------- 툴팁 오버레이 ----------
    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ol-tooltip';
    const tooltip = new ol.Overlay({
      element: tooltipEl,
      offset: [12, 12],
      positioning: 'bottom-left',
      stopEvent: false
    });
    map.addOverlay(tooltip);
    tooltip.setPosition(undefined);

    let hoverTimer = null;
    map.on('pointermove', (evt) => {
      if (evt.dragging) return;
      if (hoverTimer) clearTimeout(hoverTimer);
      const pixel = map.getEventPixel(evt.originalEvent);
      const hit = map.hasFeatureAtPixel(pixel, { layerFilter: l => l === poiLayer, hitTolerance: 6 });

      map.getTargetElement().style.cursor = hit ? 'pointer' : '';

      if (!hit) {
        tooltip.setPosition(undefined);
        return;
      }
      hoverTimer = setTimeout(() => {
        const f = map.forEachFeatureAtPixel(pixel, feat => feat, { layerFilter: l => l === poiLayer, hitTolerance: 6 });
        if (!f) { tooltip.setPosition(undefined); return; }
        const p = f.get('payload');
        if (!p) { tooltip.setPosition(undefined); return; }
        tooltipEl.innerHTML = `
          <h4>${p.title ?? '관광지'}</h4>
          <div class="row">
            <img src="${p.firstimage || 'https://static.thenounproject.com/png/504708-200.png'}" alt="">
            <div>
              <div class="meta">${p.cat3 || (p.source === 'osm' ? 'OSM' : '')}</div>
              <div class="addr">${p.addr1 || ''}</div>
              <div class="dist">경로로부터 약 ${p.dist_km ?? '?'} km</div>
            </div>
          </div>
        `;
        tooltip.setPosition(f.getGeometry().getCoordinates());
      }, 80); // 살짝 디바운스
    });

    // 클릭 시 상세(새 탭)
    map.on('singleclick', (evt) => {
      const f = map.forEachFeatureAtPixel(evt.pixel, feat => feat, { layerFilter: l => l === poiLayer, hitTolerance: 6 });
      if (!f) return;
      const p = f.get('payload');
      if (!p) return;
      // TourAPI 항목은 contentid가 숫자, OSM 폴백은 "osm:..."로 시작
      if (String(p.id || '').startsWith('osm:')) {
        window.open(`https://www.openstreetmap.org/${p.id.split(':')[1]}/${p.id.split(':')[2]}`, '_blank');
      } else {
        // 공공데이터포털 관광정보 상세(간단 이동)
        window.open(`https://korean.visitkorea.or.kr/search/search_list.do?keyword=${encodeURIComponent(p.title)}`, '_blank');
      }
    });

    // ---------- 경로 요청 ----------
    async function loadRoute() {
      document.getElementById('loading').style.display = 'inline';
      routeLayer.getSource().clear();
      poiSource.clear();
      tooltip.setPosition(undefined);

      try {
        const res = await fetch('/route', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            // 서버에서 기본값(세종 -> 속초, 남애·낙산·하조대) 사용
          })
        });
        const data = await res.json();
        if (!data.ok) {
          showToast('경로를 불러오지 못했습니다: ' + (data.error || ''));
          return;
        }

        // 1) 경로
        const coords3857 = data.route.map(([lon,lat]) => ol.proj.fromLonLat([lon,lat]));
        const geom = new ol.geom.LineString(coords3857);
        routeLayer.getSource().addFeature(new ol.Feature({ geometry: geom }));
        map.getView().fit(geom, { padding: [30,30,30,30], maxZoom: 11 });

        // 2) POI
        (data.pois || []).forEach(p => {
          const feat = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([p.mapx, p.mapy]))
          });
          feat.set('payload', p);
          poiSource.addFeature(feat);
        });

        if ((data.pois || []).length === 0) {
          showToast('경로는 생성됐지만 주변 관광지를 적절히 찾지 못했습니다. 반경과 샘플을 자동 조정해 보세요.');
        } else {
          showToast(`경로 주변 관광지 ${data.pois.length}곳 표시`);
        }
      } catch (e) {
        console.error(e);
        showToast('네트워크 오류로 실패했습니다.');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    document.getElementById('btnGo').addEventListener('click', loadRoute);
    // 페이지 진입시 바로 실행
    loadRoute();
  </script>
</body>
</html>
