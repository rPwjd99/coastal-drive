<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>바다따라: 해안도로 감성 드라이브</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 90%; }
    #controls {
      padding: 10px;
      background: #f0f0f0;
    }
    input { width: 200px; margin-right: 10px; }
    button { padding: 5px 10px; }

    .popup {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      bottom: 50px;
      left: 20px;
      min-width: 200px;
      z-index: 100;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    .popup img {
      width: 100%;
      max-height: 100px;
      object-fit: cover;
      border-radius: 4px;
    }

    .popup h3 {
      margin: 5px 0;
      font-size: 16px;
    }

    .popup p {
      margin: 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종시청)" />
    <input id="end" placeholder="도착지 (예: 속초시청)" />
    <button onclick="calculateRoute()">경로 계산</button>
  </div>
  <div id="map"></div>
  <div id="popup" class="popup" style="display: none;"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({
        center: ol.proj.fromLonLat([127.5, 36.5]),
        zoom: 7,
      }),
    });

    const vectorLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
    });
    map.addLayer(vectorLayer);

    const popupEl = document.getElementById("popup");

    function createMarker(lon, lat, color, featureData = {}) {
      const marker = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        ...featureData
      });
      marker.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill({ color: color }),
          stroke: new ol.style.Stroke({ color: '#000', width: 1 })
        })
      }));
      return marker;
    }

    function showPopup(feature, coordinate) {
      const title = feature.get("title");
      const addr = feature.get("addr1");
      const image = feature.get("firstimage") || "";
      const cid = feature.get("contentid");

      popupEl.innerHTML = `
        ${image ? `<img src="${image}" alt="${title}"/>` : ""}
        <h3>${title}</h3>
        <p>${addr || ""}</p>
        <a href="/tour_detail/${cid}" target="_blank">상세정보</a>
      `;
      popupEl.style.display = "block";
    }

    function calculateRoute() {
      popupEl.style.display = "none";
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;
      fetch("/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, end }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
          return;
        }

        vectorLayer.getSource().clear();

        const route = new ol.format.GeoJSON().readFeatures(data.route, {
          featureProjection: "EPSG:3857",
        });
        route.forEach(f => f.setStyle(new ol.style.Style({
          stroke: new ol.style.Stroke({ color: "#0000FF", width: 3 })
        })));
        vectorLayer.getSource().addFeatures(route);

        const wp = data.waypoint;
        const wpMarker = createMarker(wp.lon, wp.lat, "#00BB00", { title: `경유지: ${wp.name}` });
        vectorLayer.getSource().addFeature(wpMarker);

        data.spots.forEach(spot => {
          const marker = createMarker(spot.mapx, spot.mapy, "#0066FF", spot);
          vectorLayer.getSource().addFeature(marker);
        });

        data.restaurants.forEach(r => {
          const color = (r.title && r.title.includes("카페")) ? "#AA00FF" : "#FF3333";
          const marker = createMarker(r.mapx, r.mapy, color, r);
          vectorLayer.getSource().addFeature(marker);
        });

        map.getView().fit(vectorLayer.getSource().getExtent(), { padding: [50, 50, 50, 50] });
      })
      .catch(err => alert("서버 오류: " + err));
    }

    map.on("click", function (evt) {
      popupEl.style.display = "none";
      map.forEachFeatureAtPixel(evt.pixel, function (feature) {
        if (feature.get("title")) {
          const coords = feature.getGeometry().getCoordinates();
          showPopup(feature, coords);
        }
      });
    });

    map.on("pointermove", function () {
      popupEl.style.display = "none";
    });
  </script>
</body>
</html>
