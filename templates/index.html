<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>해안도로 감성 드라이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .popup { background: white; padding: 5px; border: 1px solid black; min-width: 200px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    const popupElement = document.createElement('div');
    popupElement.className = 'popup';
    const popup = new ol.Overlay({ element: popupElement, positioning: 'bottom-center', stopEvent: false, offset: [0, -20] });
    map.addOverlay(popup);

    function addMarker(lon, lat, name, image, info, isRestaurant) {
      const color = isRestaurant ? 'green' : 'red';
      const marker = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])) });
      marker.setStyle(new ol.style.Style({
        image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color }) })
      }));
      const vectorLayer = new ol.layer.Vector({ source: new ol.source.Vector({ features: [marker] }) });
      map.addLayer(vectorLayer);
      marker.set('popupContent', `<b>${name}</b><br>${info}<br><img src="${image}" width="200" />`);
    }

    map.on('click', function (e) {
      map.forEachFeatureAtPixel(e.pixel, function (feature) {
        const content = feature.get('popupContent');
        if (content) {
          popupElement.innerHTML = content;
          popup.setPosition(e.coordinate);
        }
      });
    });

    // 예시 좌표 - 실사용 시 서버에서 받아온 mid_lat, mid_lon 사용
    fetch('/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mid_lat: 36.5, mid_lon: 127.5 })
    })
    .then(res => res.json())
    .then(data => {
      data.tourspots?.forEach(item => {
        const name = item.title;
        const lon = parseFloat(item.mapx);
        const lat = parseFloat(item.mapy);
        const image = item.firstimage || '';
        const info = item.addr1 || '';
        addMarker(lon, lat, name, image, info, false);
      });
      data.restaurants?.forEach(item => {
        const name = item.title;
        const lon = parseFloat(item.mapx);
        const lat = parseFloat(item.mapy);
        const image = item.firstimage || '';
        const info = (item.addr1 || '') + '<br>' + (item.parking || '') + '<br>' + (item.usetime || '');
        addMarker(lon, lat, name, image, info, true);
      });
    })
    .catch(err => console.error('Error:', err));
  </script>
</body>
</html>
