<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>바다따라: 해안도로 감성 드라이브 (전국 · 2경유 순서 고정)</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; }
    #map { width: 100%; height: 88vh; }
    #controls {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: #f7f7f7; border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    input { width: 300px; padding: 8px; }
    button {
      padding: 8px 14px; border: 0; cursor: pointer; font-weight: 700;
      color: #fff; background: #2563eb; border-radius: 8px;
    }
    #poi { padding: 10px; }
    .poi { border: 1px solid #eee; border-radius: 10px; padding: 8px; margin: 8px 0; }
    .poi img { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종특별자치시 한누리대로 2130)">
    <input id="end" placeholder="도착지 (예: 강원도 속초시 중앙로 183)">
    <button id="btn">경로 계산 (출발 → 경유1 → 경유2 → 도착)</button>
  </div>
  <div id="map"></div>
  <div id="poi"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      // 전국 보기(대한민국 대략 중심/줌)
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    let routeLayer = null;
    const markerLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    let spotLayer = null;
    map.addLayer(markerLayer);

    function clearMap() {
      if (routeLayer) map.removeLayer(routeLayer);
      if (spotLayer) map.removeLayer(spotLayer);
      markerLayer.getSource().clear();
      spotLayer = null;
    }

    function drawRoute(lonlatCoords) {
      const geom = new ol.geom.LineString(lonlatCoords.map(c => ol.proj.fromLonLat(c)));
      routeLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [new ol.Feature({ geometry: geom })] }),
        style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#2563eb", width: 4 }) })
      });
      map.addLayer(routeLayer);
      map.getView().fit(geom, { padding: [50, 50, 50, 50], maxZoom: 12 });
    }

    function addMarker(lon, lat, color, label, star=false, withDesc=null) {
      const image = star
        ? new ol.style.RegularShape({ points: 5, radius: 12, radius2: 6, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: "#fff", width: 2 }) })
        : new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: "#fff", width: 2 }) });
      const style = new ol.style.Style({
        image,
        text: new ol.style.Text({ text: label || "", offsetY: -18, fill: new ol.style.Fill({ color: "#111" }), stroke: new ol.style.Stroke({ color: "#fff", width: 3 }) })
      });
      const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])) });
      if (withDesc) f.set("desc", withDesc);
      f.setStyle(style);
      markerLayer.getSource().addFeature(f);
      return f;
    }

    // 팝업(POI/경유지 공용)
    const overlayEl = document.createElement("div");
    overlayEl.style.background = "#fff";
    overlayEl.style.border = "1px solid #ddd";
    overlayEl.style.borderRadius = "10px";
    overlayEl.style.padding = "8px 10px";
    overlayEl.style.minWidth = "240px";
    const overlay = new ol.Overlay({ element: overlayEl, autoPan: { animation: { duration: 200 } } });
    map.addOverlay(overlay);

    map.on("singleclick", evt => {
      const f = map.forEachFeatureAtPixel(evt.pixel, g => g);
      if (!f) { overlay.setPosition(undefined); return; }
      const html = f.get("desc");
      if (html) {
        overlayEl.innerHTML = html;
        overlay.setPosition(evt.coordinate);
      } else {
        overlay.setPosition(undefined);
      }
    });

    document.getElementById("btn").addEventListener("click", async () => {
      const start = document.getElementById("start").value.trim();
      const end = document.getElementById("end").value.trim();
      if (!start || !end) { alert("출발지와 도착지를 모두 입력하세요."); return; }

      clearMap();

      try {
        const response = await fetch("/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, end })
        });
        const result = await response.json();
        if (!response.ok || !result.route) {
          throw new Error(result.error || "서버 오류");
        }

        const coords = result.route.features[0].geometry.coordinates.map(([lon, lat]) => [lon, lat]);
        drawRoute(coords);

        // 출발/도착
        const first = coords[0], last = coords[coords.length - 1];
        addMarker(first[0], first[1], "#22c55e", "출발");
        addMarker(last[0], last[1], "#ef4444", "도착");

        // 경유1/경유2 (별마커 + 팝업)
        (result.waypoints || []).forEach((w, i) => {
          const desc = `<b>경유${i+1}: ${w.name}</b><br>${w.address || ""}`;
          addMarker(w.lon, w.lat, "#f59e0b", `경유${i+1}`, true, desc);
        });

        // POI 마커(빨강 작은 원)
        const spots = result.spots || [];
        const poiFeatures = (spots).map(p => {
          const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(p.mapx), parseFloat(p.mapy)])) });
          const image = p.firstimage ? `<img src="${p.firstimage}" style="width:100%;border-radius:8px;margin:6px 0">` : "";
          const homepage = p.homepage ? `<div style="margin-top:4px"><a href="${p.homepage}" target="_blank">자세히 보기</a></div>` : "";
          f.set("desc", `<b>${p.title || "이름 미상"}</b><br>${image}${p.addr1 || ""}${homepage}`);
          f.setStyle(new ol.style.Style({
            image: new ol.style.Circle({ radius: 5, fill: new ol.style.Fill({ color: "#dc2626" }), stroke: new ol.style.Stroke({ color: "#fff", width: 1.5 }) })
          }));
          return f;
        });
        spotLayer = new ol.layer.Vector({ source: new ol.source.Vector({ features: poiFeatures }) });
        map.addLayer(spotLayer);

        // 간단 POI 목록
        const box = document.getElementById("poi");
        box.innerHTML = "";
        spots.forEach(p => {
          const div = document.createElement("div");
          div.className = "poi";
          div.innerHTML = `
            <div style="font-weight:700">${p.title || ""}</div>
            ${p.firstimage ? `<img src="${p.firstimage}" alt="${p.title}"/>` : ""}
            <div style="font-size:13px;color:#475569;margin-top:4px">${p.addr1 || ""}</div>
            ${p.homepage ? `<div style="font-size:12px;margin-top:4px"><a href="${p.homepage}" target="_blank">자세히 보기</a></div>` : ""}
          `;
          box.appendChild(div);
        });

        // 경유지 안내
        if (result.waypoints && result.waypoints.length) {
          alert(result.waypoints.map((w,i)=>`경유${i+1}: ${w.name}\n📍 ${w.address}`).join("\n\n"));
        }
      } catch (err) {
        alert("❌ 경로 요청 실패: " + err.message);
        console.error(err);
      }
    });

    // 빠른 테스트 기본값
    document.getElementById("start").value = "세종특별자치시 한누리대로 2130";
    document.getElementById("end").value = "강원도 속초시 중앙로 183";
  </script>
</body>
</html>
