<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>해안도로 감성 드라이브</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <style>
    html, body, #map { margin:0; padding:0; height:100%; }
    .controls {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(255,255,255,.95); padding: 8px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .controls input { width: 280px; margin: 4px 0; padding: 6px; }
    .controls button { width: 100%; padding: 8px; cursor: pointer; }
    .popup {
      background: white; padding: 6px; border: 1px solid #888; border-radius: 4px;
      font-size: 13px; max-width: 260px;
    }
    .popup img { width: 100%; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="controls">
    <div><input id="startInput" placeholder="출발지 주소 (예: 세종특별자치시청)" /></div>
    <div><input id="endInput" placeholder="도착지 주소 (예: 속초시청)" /></div>
    <button id="routeBtn">경로 찾기</button>
  </div>

  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 8 })
    });

    const routeLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(routeLayer);

    const markerLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(markerLayer);

    const popup = document.createElement("div");
    popup.className = "popup";
    const overlay = new ol.Overlay({
      element: popup, positioning: "bottom-center", stopEvent: false, offset: [0, -10]
    });
    map.addOverlay(overlay);

    map.on("pointermove", function (evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
      if (feature && feature.get("popupContent")) {
        popup.innerHTML = feature.get("popupContent");
        overlay.setPosition(evt.coordinate);
        popup.style.display = "block";
      } else {
        popup.style.display = "none";
      }
    });

    const $start = document.getElementById("startInput");
    const $end = document.getElementById("endInput");
    const $btn = document.getElementById("routeBtn");

    $btn.addEventListener("click", async () => {
      try {
        if (!$start.value.trim() || !$end.value.trim()) {
          alert("출발지와 도착지 주소를 모두 입력하세요.");
          return;
        }
        const start = await geocode($start.value.trim());
        const end = await geocode($end.value.trim());
        await fetchRoute([start.lon, start.lat], [end.lon, end.lat]);
      } catch (e) {
        console.error(e);
        alert("경로 계산 중 오류가 발생했습니다.");
      }
    });

    async function geocode(query) {
      const r = await fetch("/geocode", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "geocode fail");
      return j; // {lon, lat}
    }

    async function fetchRoute(start, end) {
      markerLayer.getSource().clear();
      routeLayer.getSource().clear();

      const res = await fetch("/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, end })
      });
      const data = await res.json();

      drawRoute(data.route);

      // 경유지 2곳 주변 관광정보 로드 (맛집/카페/관광지)
      for (const wp of data.waypoints) {
        await fetchTourspots([parseFloat(wp.lon), parseFloat(wp.lat)]);
      }
    }

    function drawRoute(routeData) {
      routeLayer.getSource().clear();
      const coords = routeData.features[0].geometry.coordinates.map(c =>
        ol.proj.fromLonLat([c[0], c[1]])
      );
      const line = new ol.geom.LineString(coords);
      const feature = new ol.Feature({ geometry: line });
      feature.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({ color: "#1976D2", width: 6 })
      }));
      routeLayer.getSource().addFeature(feature);

      const extent = line.getExtent();
      map.getView().fit(extent, { padding: [60, 60, 60, 60], maxZoom: 14 });
    }

    async function fetchTourspots(coord) {
      const res = await fetch("/tourspot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lon: coord[0], lat: coord[1] })
      });
      const data = await res.json();
      addMarkers(data);
    }

    function addMarkers(spots) {
      for (const s of spots) {
        const color = s.type === "restaurant" ? "red" : s.type === "cafe" ? "orange" : "blue";

        const marker = new ol.Feature({
          geometry: new ol.geom.Point(
            ol.proj.fromLonLat([parseFloat(s.lon), parseFloat(s.lat)])
          )
        });

        marker.setStyle(new ol.style.Style({
          image: new ol.style.Circle({
            radius: 7,
            fill: new ol.style.Fill({ color }),
            stroke: new ol.style.Stroke({ color: "#fff", width: 2 })
          })
        }));

        const lines = [];
        if (s.name) lines.push(`<strong>${s.name}</strong>`);
        if (s.addr) lines.push(s.addr);
        if (s.info) lines.push(s.info);
        if (s.img) lines.push(`<img src="${s.img}">`);
        const popupHTML = lines.join("<br/>");

        marker.set("popupContent", popupHTML);
        markerLayer.getSource().addFeature(marker);
      }
    }

    // 편의: 초기값 (원하면 삭제)
    $start.value = "세종특별자치시청";
    $end.value = "속초시청";
  </script>
</body>
</html>
