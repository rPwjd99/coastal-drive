<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🌊 바다따라: 해안도로 감성 드라이브</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <style>
    body { margin: 0; font-family: system-ui,-apple-system,Roboto,'Noto Sans KR',sans-serif; }
    #map { width: 100%; height: 90vh; }
    #controls {
      padding: 10px; background: #f7f7f7; border-bottom: 1px solid #ccc;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    input { width: 300px; padding: 6px; }
    button { padding: 6px 14px; background: #0078ff; color: #fff; border: none; cursor: pointer; border-radius: 6px; }
    .popup { background: white; padding: 10px; border: 1px solid gray; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); min-width: 220px; }
    #summary { margin-left: auto; font-size: 13px; color: #333; }
    #warn { width: 100%; color: #d00; font-size: 13px; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종시청)">
    <input id="end" placeholder="도착지 (예: 속초시청)">
    <button id="go">경로 계산</button>
    <div id="summary"></div>
    <div id="warn"></div>
  </div>
  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    let routeLayer = null;
    let spotLayer  = null;

    const popupElement = document.createElement("div");
    popupElement.className = "popup";
    const overlay = new ol.Overlay({ element: popupElement, autoPan: true, offset: [0, -10] });
    map.addOverlay(overlay);

    map.on("click", function (evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
      if (feature && feature.get("desc")) {
        popupElement.innerHTML = feature.get("desc");
        overlay.setPosition(evt.coordinate);
        popupElement.style.display = "block";
      } else {
        overlay.setPosition(undefined);
      }
    });

    async function calculateRoute() {
      overlay.setPosition(undefined);
      document.getElementById('warn').textContent = '';

      const start = document.getElementById("start").value.trim();
      const end   = document.getElementById("end").value.trim();
      if (!start || !end) { alert("출발지와 도착지를 모두 입력하세요."); return; }

      try {
        const response = await fetch("/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, end })
        });
        const result = await response.json();
        if (!response.ok || !result.route) throw new Error(result.error || "서버 오류 발생");

        // ====== 경로(파란 선) : 7월 버전 ======
        const coords = result.route.features[0].geometry.coordinates.map(
          ([lon, lat]) => ol.proj.fromLonLat([lon, lat])
        );
        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = new ol.layer.Vector({
          source: new ol.source.Vector({
            features: [new ol.Feature({ geometry: new ol.geom.LineString(coords) })]
          }),
          style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: "blue", width: 4 }) })
        });
        map.addLayer(routeLayer);
        map.getView().fit(new ol.geom.LineString(coords), { padding: [50, 50, 50, 50], maxZoom: 12 });

        // 요약(거리/시간)
        try {
          const sum = result.route.features[0].properties && result.route.features[0].properties.summary;
          const dist = sum && sum.distance; // m
          const dur  = sum && sum.duration; // s
          const parts = [];
          if (dist) parts.push(`거리 ${ (dist>=1000 ? (dist/1000).toFixed(1)+' km' : Math.round(dist)+' m') }`);
          if (dur)  parts.push(`예상 ${ (Math.floor(dur/3600)?Math.floor(dur/3600)+'시간 ':'')+Math.round((dur%3600)/60)+'분' }`);
          document.getElementById('summary').textContent = parts.join(' · ');
        } catch(e){}

        // 경유지 알림
        if (result.waypoint && result.waypoint.name) {
          alert(`✅ 경유 해안지점: ${result.waypoint.name}\n📍 ${result.waypoint.address || ''}`);
        }

        // ====== 관광/맛집 마커 & 팝업 ======
        const spots = (result.spots || []); // 관광 + 맛집(혼합)
        if (spotLayer) map.removeLayer(spotLayer);

        const features = spots.map(spot => {
          const x = parseFloat(spot.mapx), y = parseFloat(spot.mapy);
          if (!isFinite(x) || !isFinite(y)) return null;
          const coord = ol.proj.fromLonLat([x, y]);
          const f = new ol.Feature({ geometry: new ol.geom.Point(coord) });

          const image = spot.firstimage ? `<img src="${spot.firstimage}" width="180" style="max-height:140px;object-fit:cover;border-radius:4px;margin:6px 0"><br>` : "";
          const link  = spot.contentid ? `<a href="/tour_detail/${spot.contentid}" target="_blank">세부정보 보기</a>` : "";
          const cat   = spot.category === 'food' ? '🍽 맛집' : '📍 관광지';
          const addr  = spot.addr1 || "주소 없음";
          const dist  = (typeof spot.distance === 'number') ? `${spot.distance} km` : '';
          const readc = spot.readcount ? ` · 인기도 ${spot.readcount}` : '';

          f.set("desc", `
            <b>${cat} · ${spot.title || ''}</b><br>
            ${image}
            ${addr}<br>
            ${dist ? `경로 근처 거리: ${dist}<br>` : ''}
            ${readc ? `${readc}<br>` : ''}
            ${link}
          `);

          const color = (spot.category === 'food') ? "#FF3333" : "#0066FF";
          f.setStyle(new ol.style.Style({
            image: new ol.style.Circle({
              radius: 6,
              fill: new ol.style.Fill({ color }),
              stroke: new ol.style.Stroke({ color: "#fff", width: 1 })
            })
          }));
          return f;
        }).filter(Boolean);

        spotLayer = new ol.layer.Vector({ source: new ol.source.Vector({ features }) });
        map.addLayer(spotLayer);

        console.log(`[addSpots] 총 ${features.length}개`);
        if (features.length === 0) {
          const warn = document.getElementById('warn');
          if (result.tourapi_error) {
            warn.textContent = "⚠ " + result.tourapi_error + " (데이터 수집 실패)";
          } else {
            warn.textContent = "⚠ 경로 주변에서 항목을 찾지 못했습니다. (서버에서 KorService2→1 폴백 및 재시도 적용)";
          }
        }

      } catch (err) {
        alert("❌ 경로 요청 실패: " + err.message);
        console.error(err);
      }
    }

    document.getElementById("go").addEventListener("click", calculateRoute);
    document.getElementById("start").addEventListener("keydown", e => { if(e.key === "Enter") calculateRoute(); });
    document.getElementById("end").addEventListener("keydown", e => { if(e.key === "Enter") calculateRoute(); });
  </script>
</body>
</html>
