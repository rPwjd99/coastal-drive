<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>바다따라 드라이브</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" rel="stylesheet" />
  <style>
    body { font-family: sans-serif; margin: 0; }
    #map { width: 100%; height: 90vh; }
    .popup { background: white; padding: 5px; border-radius: 6px; max-width: 250px; }
    .search-bar { padding: 10px; background: #f0f0f0; }
    .search-bar input { padding: 5px; margin-right: 5px; }
  </style>
</head>
<body>
  <div class="search-bar">
    출발지: <input type="text" id="start" placeholder="출발지 주소" />
    도착지: <input type="text" id="end" placeholder="도착지 주소" />
    <button onclick="findRoute()">경로 탐색</button>
  </div>
  <div id="map"></div>
  <script>
    let map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    const vectorSource = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({ source: vectorSource });
    map.addLayer(vectorLayer);

    const iconStyles = {
      spot: new ol.style.Style({
        image: new ol.style.Icon({ src: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png' })
      }),
      restaurant: new ol.style.Style({
        image: new ol.style.Icon({ src: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png' })
      }),
      waypoint: new ol.style.Style({
        image: new ol.style.Icon({ src: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png' })
      })
    };

    async function findRoute() {
      vectorSource.clear();
      const start = document.getElementById('start').value;
      const end = document.getElementById('end').value;
      const res = await fetch('/route', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ start, end })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      const format = new ol.format.GeoJSON();
      const routeFeature = format.readFeature(data.route);
      routeFeature.getGeometry().transform('EPSG:4326', 'EPSG:3857');
      vectorSource.addFeature(routeFeature);

      const waypoint = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([data.waypoint.lon, data.waypoint.lat])) });
      waypoint.setStyle(iconStyles.waypoint);
      vectorSource.addFeature(waypoint);

      [...data.spots, ...data.restaurants].forEach(item => {
        const feature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([+item.mapx, +item.mapy])) });
        feature.setStyle(iconStyles[item.contentid ? 'spot' : 'restaurant']);
        feature.set('info', `<b>${item.title}</b><br>${item.addr1}<br>${item.firstimage ? `<img src='${item.firstimage}' width='200'/>` : ''}<br>${item.distance}km`);
        vectorSource.addFeature(feature);
      });

      const overlay = new ol.Overlay({ element: document.createElement('div'), offset: [0, -10], positioning: 'bottom-center' });
      map.addOverlay(overlay);
      map.on('click', evt => {
        map.forEachFeatureAtPixel(evt.pixel, feature => {
          const info = feature.get('info');
          if (info) {
            const el = overlay.getElement();
            el.className = 'popup';
            el.innerHTML = info;
            overlay.setPosition(evt.coordinate);
          }
        });
      });
    }
  </script>
</body>
</html>
