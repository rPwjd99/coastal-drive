<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🌊 바다따라: 해안도로 감성 드라이브</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #controls { padding: 10px; background: #f7f7f7; border-bottom: 1px solid #ddd; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    #controls input { width: 300px; max-width:40vw; padding: 6px 8px; }
    #controls button { padding: 7px 14px; background:#0078ff; color:#fff; border:0; cursor:pointer; border-radius:4px; }
    #meta { margin-left:auto; font-size:14px; color:#333; }
    #map { width: 100%; height: calc(100% - 56px); }
    .popup { background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.25); min-width: 220px; max-width: 300px; }
    .popup img { width:100%; height:auto; border-radius:4px; margin:6px 0; display:block; }
    .badge { background:#eef4ff; padding:6px 10px; border-radius:20px; border:1px solid #cfe0ff; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종시청)" />
    <input id="end" placeholder="도착지 (예: 속초시청)" />
    <button onclick="calcRoute()">경로 계산</button>
    <div id="meta"></div>
  </div>
  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: "map",
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    const routeLayer  = new ol.layer.Vector({ source: new ol.source.Vector() });
    const markerLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(routeLayer);
    map.addLayer(markerLayer);

    // 팝업
    const popEl = document.createElement("div");
    popEl.className = "popup";
    const popup = new ol.Overlay({ element: popEl, autoPan: true, offset: [0, -10] });
    map.addOverlay(popup);

    // 클릭 → 팝업
    map.on("click", (evt) => {
      let found = false;
      map.forEachFeatureAtPixel(evt.pixel, (f) => {
        const p = f.getProperties();
        if (p.type === "spot" || p.type === "restaurant") {
          const img = p.firstimage ? `<img src="${p.firstimage}" alt="${p.title}">` : "";
          popEl.innerHTML = `
            <div><strong>${p.title || ""}</strong></div>
            ${img}
            <div>${p.addr1 || ""}</div>
            <div>거리: ${p.distance ?? "?"} km</div>
            <div style="margin-top:6px;"><a href="/tour_detail/${p.contentid}" target="_blank">상세보기</a></div>
          `;
          popup.setPosition(evt.coordinate);
          found = true;
        }
      });
      if (!found) popup.setPosition(undefined);
    });

    function styleLine() {
      return new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#0066ff", width: 4 }) });
    }
    function styleCircle(color) {
      return new ol.style.Style({
        image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color:"#000", width:1 }) })
      });
    }

    async function calcRoute() {
      routeLayer.getSource().clear();
      markerLayer.getSource().clear();
      popup.setPosition(undefined);
      document.getElementById("meta").innerHTML = "";

      const start = document.getElementById("start").value.trim();
      const end   = document.getElementById("end").value.trim();
      if (!start || !end) { alert("출발지/도착지를 입력하세요."); return; }

      try {
        const res = await fetch("/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, end })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "서버 오류");

        // ✅ 경로(파란선) — 예전에 성공했던 방식 그대로
        const features = new ol.format.GeoJSON().readFeatures(data.route, {
          featureProjection: "EPSG:3857"
        });
        features.forEach(f => f.setStyle(styleLine()));
        routeLayer.getSource().addFeatures(features);
        if (features.length) {
          map.getView().fit(features[0].getGeometry(), { padding: [50,50,50,50], maxZoom: 12 });
        }

        // 경유지 (초록)
        if (data.waypoint) {
          const wp = data.waypoint;
          const ft = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([wp.lon, wp.lat])),
            title: `경유지: ${wp.name}`, type: "waypoint"
          });
          ft.setStyle(styleCircle("#00bb00"));
          markerLayer.getSource().addFeature(ft);
          alert(`✅ 경유 해안지점: ${wp.name}\n📍 ${wp.address}`);
        }

        // 상단 배지(총거리/예상시간)
        if (data.dist_km || data.eta_sec) {
          const km = (data.dist_km || 0).toFixed(1);
          const m  = Math.round((data.eta_sec || 0) / 60);
          document.getElementById("meta").innerHTML = `<span class="badge">총 ${km}km · 예상 ${m}분</span>`;
        }

        // 관광지(파랑), 맛집(빨강)
        let added = 0;
        (data.spots || []).forEach(s => {
          const ft = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(s.mapx), parseFloat(s.mapy)])),
            ...s, type: "spot"
          });
          ft.setStyle(styleCircle("#0066ff"));
          markerLayer.getSource().addFeature(ft);
          added++;
        });
        (data.restaurants || []).forEach(r => {
          const ft = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(r.mapx), parseFloat(r.mapy)])),
            ...r, type: "restaurant"
          });
          ft.setStyle(styleCircle("#ff3333"));
          markerLayer.getSource().addFeature(ft);
          added++;
        });

        if (!added) {
          alert("경로 주변에서 항목을 찾지 못했습니다. (서버가 반경/샘플 수를 자동 조정합니다)");
        }
      } catch (e) {
        alert("❌ 경로 요청 실패: " + e.message);
        console.error(e);
      }
    }
  </script>
</body>
</html>
