<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>바다따라: 해안도로 감성 드라이브 코스 추천</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 90vh; }
    #form { padding: 10px; }
    .popup { background: white; padding: 5px; border: 1px solid gray; max-width: 300px; }
    .popup img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div id="form">
    출발지: <input id="start" placeholder="예: 세종시청" />
    도착지: <input id="end" placeholder="예: 속초시청" />
    <button onclick="findRoute()">경로 탐색</button>
  </div>
  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 7 })
    });

    const routeLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    const markerLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(routeLayer);
    map.addLayer(markerLayer);

    const popup = new ol.Overlay({
      element: document.createElement("div"),
      positioning: "bottom-center",
      stopEvent: false,
      offset: [0, -20]
    });
    map.addOverlay(popup);

    map.on('click', function (evt) {
      map.forEachFeatureAtPixel(evt.pixel, function (feature) {
        const props = feature.getProperties();
        if (props.type === 'spot' || props.type === 'restaurant') {
          const el = popup.getElement();
          const img = props.firstimage ? `<img src="${props.firstimage}"><br>` : '';
          const html = `
            <div class="popup">
              <strong>${props.title}</strong><br>
              ${img}
              ${props.addr1}<br>
              거리: ${props.distance}km<br>
              ${props.overview || ''}<br>
              ${props.parking || ''} ${props.usetime || ''}<br>
              <a href="/tour_detail/${props.contentid}" target="_blank">상세보기</a>
            </div>`;
          el.innerHTML = html;
          popup.setPosition(evt.coordinate);
        }
      });
    });

    async function findRoute() {
      routeLayer.getSource().clear();
      markerLayer.getSource().clear();
      popup.setPosition(undefined);

      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;
      const res = await fetch("/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, end })
      });
      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      // 🛣️ 경로 표시 (readFeatures로 수정)
      const format = new ol.format.GeoJSON();
      const routeFeatures = format.readFeatures(data.route, {
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
      });
      routeLayer.getSource().addFeatures(routeFeatures);

      // 📍 경유지 마커
      const waypoint = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([data.waypoint.lon, data.waypoint.lat])),
        title: data.waypoint.name || "경유지",
        type: "waypoint"
      });
      waypoint.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 7,
          fill: new ol.style.Fill({ color: 'green' }),
          stroke: new ol.style.Stroke({ color: 'black', width: 1 })
        })
      }));
      markerLayer.getSource().addFeature(waypoint);

      // 📌 관광지 마커 (파란색)
      data.spots.forEach(s => {
        const marker = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(s.mapx), parseFloat(s.mapy)])),
          ...s,
          type: "spot"
        });
        marker.setStyle(new ol.style.Style({
          image: new ol.style.Icon({
            color: 'blue',
            crossOrigin: 'anonymous',
            src: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png'
          })
        }));
        markerLayer.getSource().addFeature(marker);
      });

      // 🍽️ 맛집 마커 (빨간색)
      data.restaurants.forEach(r => {
        const marker = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([parseFloat(r.mapx), parseFloat(r.mapy)])),
          ...r,
          type: "restaurant"
        });
        marker.setStyle(new ol.style.Style({
          image: new ol.style.Icon({
            color: 'red',
            crossOrigin: 'anonymous',
            src: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
          })
        }));
        markerLayer.getSource().addFeature(marker);
      });
    }
  </script>
</body>
</html>
