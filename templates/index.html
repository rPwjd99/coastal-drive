<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>해안도로 경로 안내</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <style>
    #map { width: 100%; height: 90vh; }
    body { font-family: sans-serif; margin: 0; padding: 0; }
    .search-bar { display: flex; padding: 10px; gap: 5px; }
    input, button { padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="search-bar">
    <input id="start" placeholder="출발지 예: 세종시청">
    <input id="end" placeholder="도착지 예: 속초시청">
    <button onclick="findRoute()">경로 찾기</button>
  </div>
  <div id="map"></div>
  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.5]), zoom: 8 })
    });

    let routeLayer = null;

    async function findRoute() {
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;
      const res = await fetch("/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start, end })
      });

      const data = await res.json();
      if (!res.ok) return alert(data.error);

      if (routeLayer) map.removeLayer(routeLayer);

      const route = new ol.format.GeoJSON().readFeatures(data.route, {
        featureProjection: 'EPSG:3857'
      });
      routeLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: route }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({ color: '#0066cc', width: 18 })
        })
      });
      map.addLayer(routeLayer);

      if (data.waypoint1) addMarker(data.waypoint1.lat, data.waypoint1.lon, "경유1: " + data.waypoint1.name, "green");
      if (data.waypoint2) addMarker(data.waypoint2.lat, data.waypoint2.lon, "경유2: " + data.waypoint2.name, "green");
      data.spots.forEach(s => addMarker(s.mapy, s.mapx, buildPopup(s, "관광지"), "blue"));
      data.restaurants.forEach(r => addMarker(r.mapy, r.mapx, buildPopup(r, "맛집"), "red"));
    }

    function buildPopup(item, type) {
      let popup = `<b>[${type}] ${item.title}</b><br>`;
      if (item.firstimage) popup += `<img src="${item.firstimage}" width="150"><br>`;
      if (item.addr1) popup += `주소: ${item.addr1}<br>`;
      if (item.distance) popup += `경로에서 거리: ${item.distance}km<br>`;
      if (item.usetime) popup += `이용시간: ${item.usetime}<br>`;
      if (item.parking) popup += `주차정보: ${item.parking}<br>`;
      if (item.overview) popup += `<small>${item.overview}</small>`;
      return popup;
    }

    function addMarker(lat, lon, html, color) {
      const el = document.createElement('div');
      el.className = 'marker';
      el.style.backgroundColor = color;
      el.style.width = '14px';
      el.style.height = '14px';
      el.style.borderRadius = '50%';
      el.style.border = '2px solid white';

      const overlay = new ol.Overlay({
        position: ol.proj.fromLonLat([lon, lat]),
        positioning: 'center-center',
        element: el,
        stopEvent: false
      });
      map.addOverlay(overlay);

      el.addEventListener('click', () => {
        const popup = document.createElement('div');
        popup.innerHTML = html;
        popup.style.background = 'white';
        popup.style.border = '1px solid gray';
        popup.style.padding = '5px';
        popup.style.maxWidth = '250px';

        const popupOverlay = new ol.Overlay({
          element: popup,
          positioning: 'bottom-center',
          position: ol.proj.fromLonLat([lon, lat])
        });
        map.addOverlay(popupOverlay);
        setTimeout(() => map.removeOverlay(popupOverlay), 15000);
      });
    }
  </script>
</body>
</html>
