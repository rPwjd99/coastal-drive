<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>바다따라: 해안도로 감성 드라이브 코스 추천</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Arial, sans-serif; }
    #app { display:flex; flex-direction:column; height:100%; }
    header {
      padding:10px 14px; border-bottom:1px solid #eee; background:#fafafa;
      display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    }
    header .title { font-weight:600; margin-right:10px; }
    input[type="text"] {
      width:260px; padding:8px 10px; border:1px solid #d0d0d0; border-radius:6px; outline:none;
    }
    button {
      padding:9px 14px; border:1px solid #0a7; background:#0a7; color:#fff; border-radius:6px; cursor:pointer;
    }
    button.secondary { background:#fff; color:#0a7; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .toggles { display:flex; gap:8px; align-items:center; margin-left:auto; }
    #map { flex:1; }
    #status {
      position:absolute; top:64px; right:12px; max-width:360px; z-index:1000;
      background:#fff; border:1px solid #eee; border-radius:8px; padding:10px 12px; box-shadow:0 4px 14px rgba(0,0,0,0.08);
      font-size:13px; line-height:1.4;
    }
    #status .label { font-weight:600; margin-bottom:6px; }
    .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:12px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:999px; border:1px solid #ddd; background:#f8f8f8; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .dot.route { background:#2563eb; }
    .dot.origin { background:#10b981; }
    .dot.dest { background:#ef4444; }
    .dot.wp { background:#f59e0b; }
    .dot.spot { background:#111827; }
    .dot.food { background:#7c3aed; }
    .dot.cafe { background:#be185d; }
    .popup {
      background:#fff; border:1px solid #ddd; border-radius:8px; padding:8px; min-width:220px; box-shadow:0 4px 14px rgba(0,0,0,0.12);
    }
    .popup .title { font-weight:600; margin-bottom:4px; }
    .popup img { width:100%; height:auto; border-radius:6px; display:block; margin-bottom:6px; object-fit:cover; }
    .row { display:flex; gap:6px; align-items:center; }
    .row label { font-size:12px; color:#555; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">바다따라</div>
    <input id="origin" type="text" placeholder="출발지(예: 세종특별자치시청)" />
    <input id="destination" type="text" placeholder="도착지(예: 속초시청)" />
    <button id="btnRoute">경로 계산</button>
    <div class="toggles">
      <div class="row"><input id="tgSpots" type="checkbox" checked /><label for="tgSpots">관광지</label></div>
      <div class="row"><input id="tgFood" type="checkbox" checked /><label for="tgFood">맛집</label></div>
      <div class="row"><input id="tgCafe" type="checkbox" checked /><label for="tgCafe">카페</label></div>
      <button id="btnReload" class="secondary">주변 다시 불러오기</button>
    </div>
  </header>
  <div id="map"></div>
  <div id="status" hidden>
    <div class="label">상태</div>
    <div id="msg">준비됨</div>
    <div class="legend">
      <div class="chip"><span class="dot route"></span>경로</div>
      <div class="chip"><span class="dot origin"></span>출발</div>
      <div class="chip"><span class="dot dest"></span>도착</div>
      <div class="chip"><span class="dot wp"></span>경유(해변)</div>
      <div class="chip"><span class="dot spot"></span>관광지</div>
      <div class="chip"><span class="dot food"></span>맛집</div>
      <div class="chip"><span class="dot cafe"></span>카페</div>
    </div>
  </div>
</div>

<script>
  const map = new ol.Map({
    target: 'map',
    layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
    view: new ol.View({ center: ol.proj.fromLonLat([127.5, 36.3]), zoom: 7 })
  });

  const routeSource = new ol.source.Vector();
  const routeLayer = new ol.layer.Vector({ source: routeSource });
  map.addLayer(routeLayer);

  const poiSource = new ol.source.Vector();
  const poiLayer = new ol.layer.Vector({ source: poiSource });
  map.addLayer(poiLayer);

  const markerSource = new ol.source.Vector();
  const markerLayer = new ol.layer.Vector({ source: markerSource });
  map.addLayer(markerLayer);

  function styleDot(color, radius=6) {
    return new ol.style.Style({
      image: new ol.style.Circle({
        radius: radius,
        fill: new ol.style.Fill({ color }),
        stroke: new ol.style.Stroke({ color: '#ffffff', width: 1.5 })
      })
    });
  }
  const styleOrigin = styleDot('#10b981', 7);
  const styleDest   = styleDot('#ef4444', 7);
  const styleWP     = styleDot('#f59e0b', 6);
  const styleSpot   = styleDot('#111827', 5);
  const styleFood   = styleDot('#7c3aed', 5);
  const styleCafe   = styleDot('#be185d', 5);

  const styleRoute = new ol.style.Style({
    stroke: new ol.style.Stroke({ width: 4 })
  });

  const popupEl = document.createElement('div');
  popupEl.className = 'popup';
  const overlay = new ol.Overlay({ element: popupEl, autoPan: { animation: { duration: 250 } } });
  map.addOverlay(overlay);

  function showPopup(coord3857, html) {
    popupEl.innerHTML = html;
    overlay.setPosition(coord3857);
  }

  map.on('singleclick', (e) => {
    map.forEachFeatureAtPixel(e.pixel, (feature) => {
      const props = feature.getProperties() || {};
      if (props.popup) {
        showPopup(e.coordinate, props.popup);
      }
    });
  });

  const $o = document.getElementById('origin');
  const $d = document.getElementById('destination');
  const $btn = document.getElementById('btnRoute');
  const $msg = document.getElementById('msg');
  const $status = document.getElementById('status');
  const $tgSpots = document.getElementById('tgSpots');
  const $tgFood = document.getElementById('tgFood');
  const $tgCafe = document.getElementById('tgCafe');
  const $btnReload = document.getElementById('btnReload');

  function setMsg(t) { $status.hidden = false; $msg.textContent = t; }
  function lonlatTo3857(lon, lat) { return ol.proj.fromLonLat([lon, lat]); }

  function addMarker(lon, lat, style, title, addr) {
    const f = new ol.Feature(new ol.geom.Point(lonlatTo3857(lon, lat)));
    f.setStyle(style);
    if (title || addr) {
      const html = `<div class="title">${title || ''}</div>${addr ? `<div>${addr}</div>` : ''}`;
      f.set('popup', html);
    }
    markerSource.addFeature(f);
    return f;
  }

  function addPOI(lon, lat, style, title, addr, image) {
    const f = new ol.Feature(new ol.geom.Point(lonlatTo3857(lon, lat)));
    f.setStyle(style);
    let html = '';
    if (image) html += `<img src="${image}" alt="">`;
    html += `<div class="title">${title || ''}</div>`;
    if (addr) html += `<div>${addr}</div>`;
    f.set('popup', html);
    poiSource.addFeature(f);
    return f;
  }

  function drawRoute(coordsLonLat) {
    routeSource.clear();
    const coords3857 = coordsLonLat.map(([lon, lat]) => lonlatTo3857(lon, lat));
    const f = new ol.Feature(new ol.geom.LineString(coords3857));
    f.setStyle(styleRoute);
    routeSource.addFeature(f);
    const ext = routeSource.getExtent();
    if (ext && isFinite(ext[0])) {
      map.getView().fit(ext, { duration: 350, padding: [30, 30, 30, 30], maxZoom: 13 });
    }
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      const err = (data && data.error) ? data.error : `HTTP ${res.status}`;
      throw new Error(err);
    }
    return data;
  }

  async function loadPOIs(center, radiusKm) {
    poiSource.clear();
    const qs = (obj) => new URLSearchParams(obj).toString();
    const [spots, food, cafes] = await Promise.all([
      $tgSpots.checked ? fetchJSON(`/api/tourspot?${qs({ lat: center.lat, lon: center.lon, radius_km: radiusKm })}`) : { results: [] },
      $tgFood.checked ? fetchJSON(`/api/food?${qs({ lat: center.lat, lon: center.lon, radius_km: radiusKm })}`) : { results: [] },
      $tgCafe.checked ? fetchJSON(`/api/cafe?${qs({ lat: center.lat, lon: center.lon, radius_km: radiusKm })}`) : { results: [] },
    ]);
    (spots.results || []).forEach(s => addPOI(s.lon, s.lat, styleSpot, s.title, s.address, s.image));
    (food.results || []).forEach(s => addPOI(s.lon, s.lat, styleFood, s.title, s.address, s.image));
    (cafes.results || []).forEach(s => addPOI(s.lon, s.lat, styleCafe, s.title, s.address, s.image));
  }

  async function computeRoute() {
    try {
      markerSource.clear();
      overlay.setPosition(undefined);
      const origin = $o.value.trim();
      const destination = $d.value.trim();
      if (!origin || !destination) { setMsg('출발지와 도착지를 입력하세요.'); return; }
      $btn.disabled = true;
      setMsg('경로 계산 중...');

      const res = await fetchJSON('/api/route', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin, destination })
      });

      const fc = res.geojson;
      const line = (fc.features[0].geometry.coordinates);
      drawRoute(line);

      const O = res.origin, D = res.destination;
      addMarker(O.lon, O.lat, styleOrigin, '출발', O.address);
      addMarker(D.lon, D.lat, styleDest, '도착', D.address);
      (res.waypoints || []).forEach((w, idx) => addMarker(w.lon, w.lat, styleWP, `경유지 ${idx+1}: ${w.name}`, ''));

      setMsg(`경로 계산 완료. 총 세그먼트: ${res.geojson.features[0].properties.segments}`);

      setMsg('주변 관광지/맛집/카페 불러오는 중...');
      await loadPOIs({ lat: D.lat, lon: D.lon }, 5);
      setMsg('완료.');
    } catch (err) {
      setMsg('오류: ' + err.message);
    } finally {
      $btn.disabled = false;
    }
  }

  document.getElementById('btnRoute').addEventListener('click', computeRoute);
  document.getElementById('btnReload').addEventListener('click', async () => {
    const dest = markerSource.getFeatures().find(f => {
      const p = f.getProperties() || {};
      return (p.popup || '').includes('도착');
    });
    if (!dest) { setMsg('도착지 마커를 찾을 수 없습니다. 먼저 경로를 계산하세요.'); return; }
    const coord = ol.proj.toLonLat(dest.getGeometry().getCoordinates());
    await loadPOIs({ lat: coord[1], lon: coord[0] }, 5);
    setMsg('주변 정보를 새로 불러왔습니다.');
  });

  [$o, $d].forEach(inp => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') computeRoute(); }));
</script>
</body>
</html>
