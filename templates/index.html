<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>바다따라: 해안도로 경로 추천 (Coastal Drive)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height:100%; margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #eee; display:flex; gap:12px; align-items:center; }
    header h1 { font-size:16px; margin:0; }
    .panel { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .panel input { padding:8px 10px; border:1px solid #ccc; border-radius:6px; min-width:280px; }
    .panel button { padding:9px 14px; border:0; border-radius:6px; cursor:pointer; }
    .primary { background:#111; color:#fff; }
    #map { width:100%; height: calc(100% - 62px); }
    #status { position:absolute; top:64px; left:16px; background:#0009; color:#fff; padding:8px 10px; border-radius:6px; font-size:12px; z-index:10; display:none; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
</head>
<body>
  <header>
    <h1>바다따라</h1>
    <form id="routeForm" class="panel">
      <input id="origin" placeholder="출발지 (예: 세종특별자치시청)" />
      <input id="destination" placeholder="도착지 (예: 속초시청)" />
      <button id="btnRoute" class="primary" type="button">경로 계산</button>
    </form>
  </header>
  <div id="map"></div>
  <div id="status"></div>

  <script>
    // OpenLayers 기본 지도
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([127.0, 37.5]), zoom: 7 })
    });

    const routeLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(routeLayer);

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => el.style.display = 'none', 4000);
    }

    function drawGeoJSON(fc) {
      routeLayer.getSource().clear();
      const format = new ol.format.GeoJSON();
      const feats = format.readFeatures(fc, { featureProjection: 'EPSG:3857' });
      routeLayer.getSource().addFeatures(feats);
      if (feats.length) {
        const extent = routeLayer.getSource().getExtent();
        map.getView().fit(extent, { padding: [40,40,40,40], duration: 400 });
      }
    }

    async function requestRoute(origin, destination) {
      const resp = await fetch('/api/route', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin, destination })
      });
      const j = await resp.json().catch(() => ({}));
      if (!resp.ok || !j.ok) {
        throw new Error(j.error || `요청 실패(${resp.status})`);
      }
      return j;
    }

    document.getElementById('btnRoute').addEventListener('click', async (e) => {
      e.preventDefault();
      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      if (!origin || !destination) {
        showStatus('출발지/도착지를 입력하세요.');
        return;
      }
      showStatus('경로 계산 중…');
      try {
        const res = await requestRoute(origin, destination);
        drawGeoJSON(res.route_geojson);
        showStatus(`완료: ${(res.distance_m/1000).toFixed(1)}km, 약 ${(res.duration_s/60).toFixed(0)}분`);
      } catch (err) {
        console.error(err);
        showStatus(String(err.message || err));
      }
    });
  </script>
</body>
</html>
