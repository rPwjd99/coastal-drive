<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>바다따라: 해안도로 감성 드라이브 코스 추천</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type="text"] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 260px; }
    button { padding: 9px 14px; border: 1px solid #111827; background: #111827; color: #fff; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #fff; color: #111827; }
    #map { height: calc(100% - 78px); }
    .legend { position: absolute; right: 12px; top: 86px; background: rgba(255,255,255,.95); border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .legend label { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    .badge { display:inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #374151; }
    .badge.attraction { background: #fbbf24; }
    .badge.food { background: #60a5fa; }
    .popup { position: absolute; background: #fff; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; min-width: 220px; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .popup h3 { margin: 0 0 6px; font-size: 15px; }
    .popup img { width: 100%; height: auto; border-radius: 6px; margin: 6px 0; }
    .popup .addr { color: #374151; font-size: 13px; }
    .popup .tel { color: #374151; font-size: 13px; margin-top: 4px; }
    .popup-closer { position: absolute; top: 6px; right: 8px; cursor: pointer; color: #6b7280; }
    .hint { font-size: 12px; color:#6b7280; }
  </style>

  <script>
    // ====== 백엔드 API 주소 설정 ======
    // GitHub Pages에서 사용 시 Render 배포 주소로 바꿔두었습니다.
    // 필요 시 한 줄만 수정하세요.
    const API_BASE = 'https://coastal-drive.onrender.com';
    // 개발용:
    // const API_BASE = 'http://localhost:5000';
  </script>
</head>
<body>
  <header>
    <h1>바다따라</h1>
    <div class="bar">
      <input id="start" type="text" placeholder="출발지 (예: 세종특별자치시청)" />
      <input id="end" type="text" placeholder="도착지 (예: 속초시청)" />
      <button id="go">경로 검색</button>
      <button id="clear" class="secondary">초기화</button>
      <span class="hint">주소/장소명은 서버에서 NAVER 지오코딩으로 해석합니다.</span>
    </div>
  </header>

  <div id="map"></div>

  <div class="legend">
    <div><strong>표시 옵션</strong></div>
    <label><span class="badge attraction"></span> 관광지(12)
      <input type="checkbox" id="toggle-attraction" checked style="margin-left:8px;">
    </label>
    <label><span class="badge food"></span> 맛집(39)
      <input type="checkbox" id="toggle-food" checked style="margin-left:8px;">
    </label>
  </div>

  <!-- 팝업 -->
  <div id="popup" class="popup" style="display:none;">
    <div class="popup-closer" id="popup-closer">✕</div>
    <div id="popup-content"></div>
  </div>

  <script>
    // --------- OpenLayers 기본 지도 ----------
    const proj = ol.proj;
    const fromLonLat = proj.fromLonLat;

    const baseLayer = new ol.layer.Tile({
      source: new ol.source.OSM()
    });

    const routeSource = new ol.source.Vector();
    const routeLayer = new ol.layer.Vector({
      source: routeSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ width: 4 })
      })
    });

    const markerSource = new ol.source.Vector();
    const markerLayer = new ol.layer.Vector({
      source: markerSource
    });

    // 관광지와 음식점 레이어를 분리(토글용)
    const poiAttractionSource = new ol.source.Vector();
    const poiAttractionLayer = new ol.layer.Vector({
      source: poiAttractionSource,
      style: feature => new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill(),
          stroke: new ol.style.Stroke()
        })
      })
    });

    const poiFoodSource = new ol.source.Vector();
    const poiFoodLayer = new ol.layer.Vector({
      source: poiFoodSource,
      style: feature => new ol.style.Style({
        image: new ol.style.RegularShape({
          points: 5,
          radius: 7,
          fill: new ol.style.Fill(),
          stroke: new ol.style.Stroke()
        })
      })
    });

    const map = new ol.Map({
      target: 'map',
      layers: [baseLayer, routeLayer, markerLayer, poiAttractionLayer, poiFoodLayer],
      view: new ol.View({
        center: fromLonLat([127.0, 37.5]),
        zoom: 7
      })
    });

    // 팝업 오버레이
    const popupEl = document.getElementById('popup');
    const popupContentEl = document.getElementById('popup-content');
    const popupCloserEl = document.getElementById('popup-closer');
    const popupOverlay = new ol.Overlay({
      element: popupEl,
      autoPan: { animation: { duration: 250 } }
    });
    map.addOverlay(popupOverlay);
    popupCloserEl.onclick = () => { popupOverlay.setPosition(undefined); popupEl.style.display = 'none'; };

    // 레이어 토글
    document.getElementById('toggle-attraction').addEventListener('change', (e) => {
      poiAttractionLayer.setVisible(e.target.checked);
    });
    document.getElementById('toggle-food').addEventListener('change', (e) => {
      poiFoodLayer.setVisible(e.target.checked);
    });

    // --------- 헬퍼들 ----------
    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return r.json();
    }
    async function getJSON(url) {
      const r = await fetch(url);
      return r.json();
    }
    function addMarker(lon, lat, label) {
      const f = new ol.Feature({
        geometry: new ol.geom.Point(fromLonLat([lon, lat])),
        label: label || ''
      });
      // 기본 스타일(점)
      f.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill(),
          stroke: new ol.style.Stroke()
        }),
        text: new ol.style.Text({
          text: label || '',
          offsetY: -14,
          font: 'bold 12px sans-serif',
          fill: new ol.style.Fill()
        })
      }));
      markerSource.addFeature(f);
    }
    function clearAll() {
      routeSource.clear();
      markerSource.clear();
      poiAttractionSource.clear();
      poiFoodSource.clear();
      popupOverlay.setPosition(undefined);
      document.getElementById('popup').style.display = 'none';
    }
    function fitToGeometry(geom) {
      const extent = geom.getExtent();
      map.getView().fit(extent, { padding: [40, 40, 40, 40], maxZoom: 15, duration: 300 });
    }

    // --------- 메인 로직: 경로 검색 + TourAPI 표시 ----------
    document.getElementById('go').addEventListener('click', async () => {
      const startQ = document.getElementById('start').value.trim();
      const endQ = document.getElementById('end').value.trim();
      if (!startQ || !endQ) {
        alert('출발지와 도착지를 모두 입력하세요.');
        return;
      }

      clearAll();

      try {
        // 1) 지오코딩
        const s = await postJSON(`${API_BASE}/api/geocode`, { query: startQ });
        if (!s.ok) throw new Error(s.error || '출발지 지오코딩 실패');
        const g = await postJSON(`${API_BASE}/api/geocode`, { query: endQ });
        if (!g.ok) throw new Error(g.error || '도착지 지오코딩 실패');

        addMarker(s.lng, s.lat, '출발');
        addMarker(g.lng, g.lat, '도착');

        // 2) 길찾기(필요 시 waypoints 전달 가능)
        const route = await postJSON(`${API_BASE}/api/route`, {
          start: { lat: s.lat, lng: s.lng },
          end: { lat: g.lat, lng: g.lng }
          // waypoints: [{ lat: ..., lng: ... }, ...]
        });
        if (!route.ok) throw new Error(route.error || '경로 계산 실패');

        const line = new ol.geom.LineString(
          route.geometry.coordinates.map(([lon, lat]) => fromLonLat([lon, lat]))
        );
        const routeFeature = new ol.Feature({ geometry: line });
        routeSource.addFeature(routeFeature);
        fitToGeometry(line);

        // 3) TourAPI POIs (관광지 + 맛집)
        const pois = await getJSON(`${API_BASE}/api/tourspot?lat=${g.lat}&lng=${g.lng}&radius=5000&contentTypeId=12,39`);
        if (pois.ok && Array.isArray(pois.features)) {
          pois.features.forEach(ft => {
            const [lon, lat] = ft.geometry.coordinates;
            const p = ft.properties || {};
            const f = new ol.Feature({
              geometry: new ol.geom.Point(fromLonLat([lon, lat])),
              properties: p
            });
            if (p.contentTypeId === 39) {
              poiFoodSource.addFeature(f);
            } else {
              poiAttractionSource.addFeature(f);
            }
          });
        }
      } catch (err) {
        console.error(err);
        alert(`오류: ${err.message || err}`);
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      clearAll();
    });

    // --------- 클릭 팝업 ----------
    map.on('singleclick', (evt) => {
      const features = map.getFeaturesAtPixel(evt.pixel, { hitTolerance: 5 }) || [];
      const poi = features.find(f => f.get('properties'));
      if (!poi) {
        popupOverlay.setPosition(undefined);
        document.getElementById('popup').style.display = 'none';
        return;
      }
      const props = poi.get('properties');
      const coord = evt.coordinate;

      const title = props.title || '상세정보';
      const img = props.firstimage ? `<img src="${props.firstimage}" alt="thumbnail" />` : '';
      const addr = props.addr1 ? `<div class="addr">${props.addr1}</div>` : '';
      const tel  = props.tel ? `<div class="tel">☎ ${props.tel}</div>` : '';
      popupContentEl.innerHTML = `<h3>${title}</h3>${img}${addr}${tel}`;
      popupEl.style.display = 'block';
      popupOverlay.setPosition(coord);
    });
  </script>
</body>
</html>
