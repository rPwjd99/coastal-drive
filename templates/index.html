<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>🌊 바다따라: 해안도로 감성 드라이브</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.3.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.3.0/dist/ol.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; font-family:sans-serif; }
    #controls { padding:10px; background:#f7f7f7; border-bottom:1px solid #ccc; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    #controls input { width:300px; padding:6px; }
    #controls button { padding:6px 14px; background:#0078ff; color:#fff; border:0; cursor:pointer; }
    #map { width:100%; height: calc(100vh - 56px); }

    /* OpenLayers overlay가 지상에 보이도록 z-index 보정 */
    .ol-overlaycontainer, .ol-overlaycontainer-stopevent { z-index: 1000 !important; }

    /* 팝업 스타일 */
    .ol-popup{
      position:absolute; background:#fff; border:1px solid #ccc; border-radius:8px;
      padding:10px 12px; box-shadow:0 2px 6px rgba(0,0,0,.25); min-width:220px;
    }
    .ol-popup:after,.ol-popup:before{
      top:100%; border:solid transparent; content:""; height:0; width:0; position:absolute; pointer-events:none;
    }
    .ol-popup:after{ border-top-color:#fff; border-width:10px; left:36px; margin-left:-10px; }
    .ol-popup:before{ border-top-color:#ccc; border-width:11px; left:36px; margin-left:-11px; }

    .popup-title{ font-weight:700; margin-bottom:6px; }
    .popup-row{ font-size:13px; color:#333; margin:3px 0; }
    .popup-img{ width:100%; max-height:140px; object-fit:cover; border-radius:6px; margin:6px 0; display:none; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="start" placeholder="출발지 (예: 세종시청)" />
    <input id="end" placeholder="도착지 (예: 속초시청)" />
    <button id="btnRoute" type="button">경로 계산</button>
  </div>
  <div id="map"></div>

  <script>
    // 같은 도메인이면 빈 문자열. 분리 배포 시 백엔드 주소 입력
    const API_BASE = "";

    // ===== 지도/레이어 =====
    const map = new ol.Map({
      target: "map",
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([127.5,36.5]), zoom: 7 })
    });

    let routeLayer = null;
    const tourLayer = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 30, declutter:true });
    const foodLayer = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 40, declutter:true });
    const wpLayer   = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 50 });
    const seLayer   = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 60 });
    map.addLayer(tourLayer); map.addLayer(foodLayer); map.addLayer(wpLayer); map.addLayer(seLayer);

    const routeStyle = new ol.style.Style({ stroke: new ol.style.Stroke({ color:'#0066ff', width:4 }) });
    const tourStyle  = new ol.style.Style({ image: new ol.style.Circle({ radius:6, fill:new ol.style.Fill({color:'#1976d2'}), stroke:new ol.style.Stroke({color:'#fff',width:1}) }) });
    const foodStyle  = new ol.style.Style({ image: new ol.style.Circle({ radius:6, fill:new ol.style.Fill({color:'#e53935'}), stroke:new ol.style.Stroke({color:'#fff',width:1}) }) });
    const wpStyle    = new ol.style.Style({ image: new ol.style.RegularShape({ points:5, radius:9, fill:new ol.style.Fill({color:'#ff6f00'}), stroke:new ol.style.Stroke({color:'#fff',width:1}) }) });
    const startStyle = new ol.style.Style({ image: new ol.style.RegularShape({ points:4, radius:7, angle:Math.PI/4, fill:new ol.style.Fill({color:'#6a1b9a'}), stroke:new ol.style.Stroke({color:'#fff',width:1}) }) });

    // 도착지 깃발 SVG 아이콘
    const flagSVG = encodeURI(
      `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="32" viewBox="0 0 28 32">
        <path d="M6 30V2h1c4 0 8-1 12 2 3 2 5 2 8 1v14c-3 1-5 1-8-1-4-3-8-2-12-2V30z" fill="#c62828"/>
        <circle cx="6" cy="30" r="2" fill="#555"/>
      </svg>`
    );
    const endStyle  = new ol.style.Style({
      image: new ol.style.Icon({ src: "data:image/svg+xml;utf8," + flagSVG, scale: 1, crossOrigin:"anonymous" })
    });

    tourLayer.setStyle(tourStyle);
    foodLayer.setStyle(foodStyle);
    wpLayer.setStyle(wpStyle);

    // ===== 유틸 =====
    function escapeHtml(t){ return (t||"").toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function drawRoute(coordsLonLat){
      const coords3857 = coordsLonLat.map(([lon,lat])=>ol.proj.fromLonLat([lon,lat]));
      if(routeLayer) map.removeLayer(routeLayer);
      routeLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [ new ol.Feature({ geometry:new ol.geom.LineString(coords3857) }) ] }),
        style: routeStyle, zIndex: 10
      });
      map.addLayer(routeLayer);
      map.getView().fit(new ol.geom.LineString(coords3857), { padding:[50,50,50,50], maxZoom: 12 });
    }

    function clearSpots(){ tourLayer.getSource().clear(); foodLayer.getSource().clear(); }
    function clearWaypoints(){ wpLayer.getSource().clear(); seLayer.getSource().clear(); }

    function addSpotFeature(spot){
      const lon = parseFloat(spot.mapx), lat = parseFloat(spot.mapy);
      if(!isFinite(lon) || !isFinite(lat)) return;

      // category가 없으면 contenttypeid로 추론
      const category = spot.category ? String(spot.category) :
                       (String(spot.contenttypeid) === "39" ? "food" : "tour");

      const feat = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon,lat])),
        isSpot: true,
        category,
        contentid: spot.contentid,
        title: spot.title || "",
        addr1: spot.addr1 || "",
        firstimage: spot.firstimage || "",
        homepage: spot.homepage || "",
        tel: spot.tel || "",
        openhour: spot.openhour || "",
        restday: spot.restday || "",
        parking_info: spot.parking_info || "",
        distance_km: spot.distance_km || ""
      });

      (category === "food" ? foodLayer : tourLayer).getSource().addFeature(feat);
    }

    function addWaypointsAndSE(wps, startLonLat, endLonLat){
      clearWaypoints();
      if(Array.isArray(wps)){
        let i=1;
        for(const wp of wps){
          const lon = parseFloat(wp.lon), lat = parseFloat(wp.lat);
          if(!isFinite(lon)||!isFinite(lat)) continue;
          const f = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([lon,lat])),
            isSpot:false, category:"waypoint", title:`경유지${i++}: ${escapeHtml(wp.name||'')}`
          });
          f.setStyle(wpStyle);
          wpLayer.getSource().addFeature(f);
        }
      }
      if(startLonLat){
        const f = new ol.Feature({ geometry:new ol.geom.Point(ol.proj.fromLonLat(startLonLat)), isSpot:false, category:"start", title:"출발지" });
        f.setStyle(startStyle); seLayer.getSource().addFeature(f);
      }
      if(endLonLat){
        const f = new ol.Feature({ geometry:new ol.geom.Point(ol.proj.fromLonLat(endLonLat)), isSpot:false, category:"end", title:"도착지" });
        f.setStyle(endStyle); seLayer.getSource().addFeature(f);
      }
    }

    // ===== 팝업 (hover) =====
    const hoverEl = document.createElement('div');
    hoverEl.className = 'ol-popup';
    const hoverOverlay = new ol.Overlay({ element: hoverEl, autoPan:false });
    map.addOverlay(hoverOverlay);

    function makePopupHTML(p){
      const catMap = {food:'맛집', tour:'관광지', waypoint:'경유지', start:'출발지', end:'도착지'};
      const cat = catMap[p.category] || '';
      const title = escapeHtml(p.title || '정보');
      const addr = escapeHtml(p.addr1 || '');
      const tel  = escapeHtml(p.tel || '');
      const hours= escapeHtml(p.openhour || '');
      const rest = escapeHtml(p.restday || '');
      const park = escapeHtml(p.parking_info || '');
      const dist = (p.distance_km && !isNaN(parseFloat(p.distance_km))) ? `경로 기준 거리: ${parseFloat(p.distance_km).toFixed(2)} km` : '';
      const img  = (p.firstimage && typeof p.firstimage==='string') ? p.firstimage : '';
      const detail = p.contentid ? `<div class="popup-row"><a href="/tour_detail/${p.contentid}" target="_blank" rel="noopener">자세히 보기</a></div>` : '';
      const hp = p.homepage ? `<div class="popup-row"><a href="${escapeHtml(p.homepage)}" target="_blank" rel="noopener">홈페이지</a></div>` : '';

      const lines=[];
      if(addr) lines.push(`<div class="popup-row">${addr}</div>`);
      if(dist) lines.push(`<div class="popup-row">${dist}</div>`);
      if(tel)  lines.push(`<div class="popup-row">전화: ${tel}</div>`);
      if(hours)lines.push(`<div class="popup-row">운영시간: ${hours}</div>`);
      if(rest) lines.push(`<div class="popup-row">휴무: ${rest}</div>`);
      if(park) lines.push(`<div class="popup-row">주차: ${park}</div>`);
      if(hp)   lines.push(hp);
      if(detail) lines.push(detail);

      return `
        <div class="popup-title">${cat?`[${cat}] `:''}${title}</div>
        ${img ? `<img class="popup-img" src="${img}" onload="this.style.display='block'" onerror="this.style.display='none'">` : ''}
        ${lines.join('')}
      `;
    }

    // 포인트만 우선 탐지 + hitTolerance로 관용
    let lastHoverKey = null;
    map.on('pointermove', (evt)=>{
      let feature = null;
      map.forEachFeatureAtPixel(evt.pixel, (f)=>{
        const g = f.getGeometry && f.getGeometry();
        if (g && g.getType()==='Point') { feature = f; return true; }
        return false;
      }, {hitTolerance: 12});

      if(feature && feature.get('isSpot')){
        const props = feature.getProperties();
        const key = props.contentid || props.title;
        if(key !== lastHoverKey){
          hoverEl.innerHTML = makePopupHTML(props);
          lastHoverKey = key;
        }
        hoverOverlay.setPosition(feature.getGeometry().getCoordinates());
        map.getTargetElement().style.cursor = 'pointer';
      }else{
        hoverOverlay.setPosition(undefined);
        lastHoverKey = null;
        map.getTargetElement().style.cursor = '';
      }
    });

    // 클릭 시에도 포인트만 핀(Pin) 팝업 가능(원하면 유지)
    map.on('singleclick', (evt)=>{
      let feature = null;
      map.forEachFeatureAtPixel(evt.pixel, (f)=>{
        const g = f.getGeometry && f.getGeometry();
        if (g && g.getType()==='Point') { feature = f; return true; }
        return false;
      }, {hitTolerance: 12});
      if(feature && feature.get('isSpot')){
        const props = feature.getProperties();
        hoverEl.innerHTML = makePopupHTML(props);
        hoverOverlay.setPosition(feature.getGeometry().getCoordinates());
      }
    });

    // ===== 경로 계산 =====
    async function calculateRoute(){
      const start = document.getElementById('start').value.trim();
      const end   = document.getElementById('end').value.trim();
      if(!start || !end){ alert('출발지와 도착지를 모두 입력하세요.'); return; }

      try{
        const res = await fetch(`${API_BASE}/route`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ start, end })
        });
        const data = await res.json();
        if(!res.ok || !data.route) throw new Error(data.error || '경로 요청 실패');

        // 경로 그리기
        const coords = data.route.features[0].geometry.coordinates; // [lon,lat] 배열
        drawRoute(coords);

        // 출발/도착 마커 + 경유지
        const startLonLat = coords.length ? [coords[0][0], coords[0][1]] : null;
        const endLonLat   = coords.length ? [coords[coords.length-1][0], coords[coords.length-1][1]] : null;
        addWaypointsAndSE(data.waypoints_used || [], startLonLat, endLonLat);

        // 관광지/맛집 마커
        clearSpots();
        const spots = Array.isArray(data.spots) ? data.spots : [];
        spots.forEach(addSpotFeature);
        // (백엔드가 restaurants를 별도로 보낼 때도 커버)
        const restaurants = Array.isArray(data.restaurants) ? data.restaurants : (data.spots_grouped && Array.isArray(data.spots_grouped.food) ? data.spots_grouped.food : []);
        restaurants.forEach(s => addSpotFeature({ ...s, category: 'food' }));

      }catch(err){
        console.error(err);
        alert('❌ 경로 요청 실패: ' + (err.message || err));
      }
    }

    document.getElementById('btnRoute').addEventListener('click', calculateRoute);
    ['start','end'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown',e=>{
        if(e.key==='Enter') document.getElementById('btnRoute').click();
      });
    });
  </script>
</body>
</html>
